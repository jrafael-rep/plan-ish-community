<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://gmizaoscvwarsppcmfpr.supabase.co wss://gmizaoscvwarsppcmfpr.supabase.co https://cdn.jsdelivr.net; img-src 'self' data: https://gmizaoscvwarsppcmfpr.supabase.co; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; base-uri 'self'; form-action 'self'">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Comunidade Plan-ish</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="assets/style.css">
<script type="module" src="assets/feed.js"></script>
</head>
<body>
<main class="wrap feed-wrap">
<div class="feed-top">
  <h1>Explorar</h1>
  <p class="muted">Viagens de quem viajou com o Plan-ish. Abre uma para ver o dia a dia, ou leva-a para o teu planeamento.</p>
  <label for="search" class="sr-only">Procurar viagens por destino ou título</label>
  <input id="search" class="search" type="search" placeholder="Procurar destino ou título" autocomplete="off" enterkeyhint="search">
  <div class="tabs" role="group" aria-label="Mostrar">
    <button class="tab" type="button" data-level="" aria-pressed="true">Tudo</button>
    <button class="tab" type="button" data-level="original" aria-pressed="false">GPS verificado</button>
    <button class="tab" type="button" data-level="done" aria-pressed="false">Feitas</button>
    <button class="tab" type="button" data-level="plan" aria-pressed="false">Roteiros</button>
  </div>
  <div class="sorts" role="group" aria-label="Ordenar">
    <button class="sort" type="button" data-sort="recent" aria-pressed="true">Mais recentes</button>
    <button class="sort" type="button" data-sort="liked" aria-pressed="false">Mais gostadas</button>
  </div>
</div>
<div id="status"></div>
<div id="feed" class="feed"></div>
</main>
</body>
</html>
