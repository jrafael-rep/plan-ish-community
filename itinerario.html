<meta property="og:type" content="website">
<meta property="og:site_name" content="Comunidade Plan-ish">

<meta property="og:description" content="Viagens de quem viajou com o Plan-ish: itinerários com GPS verificado, fotografias e orçamento. Copia um para o teu planeamento.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="assets/pc.css">

</head>
<body class="page-itinerary page-wide">
<main class="wrap feed-wrap itin">
<p class="back"><a href="./">← Explorar</a></p>
<div id="status"></div>
<div class="itin-grid">
<aside id="itin-side" class="itin-side" hidden></aside>
<div id="itinerary" class="hidden">
  <div id="owner" class="owner-bar hidden"></div>
  <div id="card"></div>
  <section id="done-by" class="panel hidden" aria-labelledby="done-title">
    <h2 id="done-title"></h2>
    <div class="people" id="people"></div>
  </section>
  <section class="panel" id="avaliacoes" aria-labelledby="reviews-title">
    <h2 id="reviews-title">Avaliações</h2>
    <div id="score"></div>
    <form id="my-review" class="my-review hidden">
      <fieldset class="star-input" id="star-input">
        <legend id="my-review-title">A tua avaliação</legend>
      </fieldset>
      <label for="review-body" class="sr-only">Comentário da avaliação</label>
      <textarea id="review-body" maxlength="2000" placeholder="O que correu bem, o que mudavas (opcional)…"></textarea>
      <p class="small muted" id="review-note"></p>
      <p class="row end">
        <button class="btn quiet danger hidden" type="button" id="review-delete">Apagar a minha avaliação</button>
        <button class="btn primary" type="submit" id="review-send">Publicar</button>
      </p>
    </form>
    <p id="review-signin" class="notice hidden"></p>
    <div id="reviews-made" class="review-group hidden"></div>
    <div id="reviews-other" class="review-group hidden"></div>
  </section>
  <section class="panel" id="conversa" aria-labelledby="comments-title">
    <h2 id="comments-title">Conversa</h2>
    <div id="comments"></div>
    <form id="comment-form" class="composer hidden">
      <div class="replying hidden" id="replying"></div>
      <label for="comment-body" id="comment-label" class="sr-only">Comentar</label>
      <textarea id="comment-body" maxlength="2000" required placeholder="Uma dica, uma pergunta, um obrigado…"></textarea>
      <p class="row end"><button class="btn primary" type="submit" id="comment-send">Publicar</button></p>
    </form>
    <p id="comment-signin" class="notice hidden"></p>
  </section>
  <p class="report"><button class="btn quiet" id="report" type="button"></button></p>
</div>
</div>
</main>
</body>
</html>
