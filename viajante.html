<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://gmizaoscvwarsppcmfpr.supabase.co wss://gmizaoscvwarsppcmfpr.supabase.co https://cdn.jsdelivr.net; img-src 'self' data: https://gmizaoscvwarsppcmfpr.supabase.co; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; base-uri 'self'; form-action 'self'">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Viajante · Comunidade Plan-ish</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="assets/style.css">
<script type="module" src="assets/profile.js"></script>
</head>
<body>
<main class="wrap feed-wrap">
<p class="back"><a href="./">← Explorar</a></p>
<div id="status"></div>
<section id="profile" class="hidden">
  <header class="profile-head">
    <div id="who"></div>
    <div class="stats" id="stats"></div>
  </header>
  <div class="tabs" role="tablist" aria-label="Viagens">
    <button class="tab" type="button" role="tab" id="tab-mine" aria-selected="true" aria-pressed="true" aria-controls="published">Publicadas</button>
    <button class="tab" type="button" role="tab" id="tab-done" aria-selected="false" aria-pressed="false" aria-controls="done">Também fez</button>
  </div>
  <div id="published" class="grid" role="tabpanel" aria-labelledby="tab-mine"></div>
  <div id="done" class="grid" role="tabpanel" aria-labelledby="tab-done" hidden></div>
</section>
</main>
</body>
</html>
